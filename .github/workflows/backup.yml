name: 贴吧兜底签到 (14:11)

on:
  workflow_dispatch:
  schedule:
    - cron: '11 6 * * *'   # UTC 06:11 = 北京时间 14:11

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BDUSS: ${{ secrets.BDUSS }}
      PTOKEN: ${{ secrets.PTOKEN }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      WORKFLOW_NAME: backup

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 兜底签到
        id: signin
        run: python run.py --backup
        continue-on-error: true

      - name: 提交签到状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/signin-status.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新签到状态 [skip ci]"
          # 并发场景（巡检与定时任务重叠、上游已被抢先提交）下裸 git push
          # 会因非快进被拒。此处在远端最新提交之上重建状态提交再重试。
          BRANCH="${GITHUB_REF_NAME:-master}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ 状态已提交（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒（第 $i 次），与远端对齐后重试…"
            git fetch origin "$BRANCH" || true
            git reset --soft FETCH_HEAD 2>/dev/null || true
            git add cache/signin-status.json
            git commit -m "chore: 更新签到状态 [skip ci]" 2>/dev/null || true
            sleep 3
          done
          # 状态提交失败不影响本次签到结果；下次运行会重新对齐状态
          echo "⚠️ 状态提交未成功，本次签到结果不受影响"
          exit 0

      # 签到步骤用了 continue-on-error，这里把真实结果反映到 workflow 状态上
      - name: 结果判定
        if: always()
        run: |
          if [ "${{ steps.signin.outcome }}" = "failure" ]; then
            echo "::error::兜底签到执行失败，请查看上方日志"
            exit 1
          fi

name: 补签 (10:31)

on:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * *'   # UTC 02:31 = 北京时间 10:31

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      BDUSS: ${{ secrets.BDUSS }}
      PTOKEN: ${{ secrets.PTOKEN }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      WORKFLOW_NAME: retry-signin

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查主签 08:17 状态
        id: check
        run: |
          python -c "
          import json, os
          from datetime import datetime

          today = datetime.now().strftime('%Y-%m-%d')
          status_file = 'cache/signin-status.json'

          if not os.path.exists(status_file):
              print('NEED_RETRY')
              exit(0)

          with open(status_file, 'r', encoding='utf-8') as f:
              s = json.load(f)

          if s.get('date') != today:
              print('NEED_RETRY')
          elif s.get('fail', 0) == 0 and s.get('success', 0) > 0:
              print('ALREADY_OK')
          elif s.get('fail', 0) > 0:
              print('NEED_RETRY')
          elif s.get('fail', 0) == -1:
              print('NEED_RETRY')
          else:
              print('NEED_RETRY')
          " > /tmp/status.txt
          cat /tmp/status.txt
          echo "STATUS=$(cat /tmp/status.txt)" >> $GITHUB_ENV

      - name: 执行补签
        if: env.STATUS == 'NEED_RETRY'
        id: retry_signin
        run: python run.py
        continue-on-error: true

      - name: 提交签到状态
        if: always() && env.STATUS == 'NEED_RETRY'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/signin-status.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新签到状态(补签) [skip ci]"
          # 并发场景（巡检与定时任务重叠、上游已被抢先提交）下裸 git push
          # 会因非快进被拒。此处在远端最新提交之上重建状态提交再重试。
          BRANCH="${GITHUB_REF_NAME:-master}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ 状态已提交（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒（第 $i 次），与远端对齐后重试…"
            git fetch origin "$BRANCH" || true
            git reset --soft FETCH_HEAD 2>/dev/null || true
            git add cache/signin-status.json
            git commit -m "chore: 更新签到状态(补签) [skip ci]" 2>/dev/null || true
            sleep 3
          done
          # 状态提交失败不影响本次签到结果；下次运行会重新对齐状态
          echo "⚠️ 状态提交未成功，本次签到结果不受影响"
          exit 0

      - name: 跳过（主签已成功）
        if: env.STATUS == 'ALREADY_OK'
        run: echo "主力签到已全部成功，无需补签"

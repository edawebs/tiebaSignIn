name: 补签 (10:00)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # UTC 02:00 = 北京时间 10:00

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      BDUSS: ${{ secrets.BDUSS }}
      PTOKEN: ${{ secrets.PTOKEN }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      WORKFLOW_NAME: retry-signin

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查 08:00 签到状态
        id: check
        run: |
          python -c "
          import json, os
          from datetime import datetime

          today = datetime.now().strftime('%Y-%m-%d')
          status_file = 'cache/signin-status.json'

          if not os.path.exists(status_file):
              print('NEED_RETRY')
              exit(0)

          with open(status_file, 'r', encoding='utf-8') as f:
              s = json.load(f)

          if s.get('date') != today:
              print('NEED_RETRY')
          elif s.get('fail', 0) == 0 and s.get('success', 0) > 0:
              print('ALREADY_OK')
          elif s.get('fail', 0) > 0:
              print('NEED_RETRY')
          elif s.get('fail', 0) == -1:
              print('NEED_RETRY')
          else:
              print('NEED_RETRY')
          " > /tmp/status.txt
          cat /tmp/status.txt
          echo "STATUS=$(cat /tmp/status.txt)" >> $GITHUB_ENV

      - name: 执行补签
        if: env.STATUS == 'NEED_RETRY'
        id: retry_signin
        run: python run.py
        continue-on-error: true

      - name: 提交签到状态
        if: always() && env.STATUS == 'NEED_RETRY'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/signin-status.json
          git diff --staged --quiet || (
            git commit -m "chore: 更新签到状态(补签) [skip ci]"
            git push
          )

      - name: 跳过（08:00 已成功）
        if: env.STATUS == 'ALREADY_OK'
        run: echo "08:00 签到已全部成功，无需补签"
